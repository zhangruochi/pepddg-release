# Minimal PepDDG example configuration.
# Uses derived clean-3 anchor (no precomputed anchor column needed).

input_csv: internal_tools/pepddg/minimal_example/input.csv
output_csv: internal_tools/pepddg/minimal_example/output/scored.csv
output_dir: internal_tools/pepddg/minimal_example/output

mode: zs
score_column: rankscore_pepddg_zs
anchor_column: null
anchor_preference: []
strict_anchor: false

baseline_column_for_delta: null

write_auxiliary_columns: true
write_run_manifest: true
write_policy_audit: true
write_gate_metrics: true

variant_name: pepddg_zs
seed: 20260302

banned_patterns:
  - foldx
  - rosetta
  - cartddg
  - stabddg
  - esm2
  - esmif
  - esm3
  - saprot
  - diffaffinity

allowed_output_roots: []

weights:
  w_neg: -0.37744658504381534
  w_bind: -0.3740327505870402
  w_disp_pen: -0.017201058980289563
  w_m: 0.9446730912058925
